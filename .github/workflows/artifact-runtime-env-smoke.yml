name: Artifact runtime env smoke

on:
  workflow_dispatch: {}
  push:
    branches:
      - feature/single-file-upload-download
    paths:
      - .github/workflows/artifact-runtime-env-smoke.yml
      - .github/actions/**
      - scripts/upload-single-file-artifact.cjs
      - scripts/download-single-file-artifact.cjs
      - packages/artifact/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/artifact-runtime-env-smoke.yml
      - .github/actions/**
      - scripts/upload-single-file-artifact.cjs
      - scripts/download-single-file-artifact.cjs
      - packages/artifact/**

jobs:
  smoke-host:
    name: Smoke (host runner)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install + build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run bootstrap
          npm run build
          test -f packages/artifact/lib/artifact.js

      - name: Print runtime env (partial)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ACTIONS_RUNTIME_TOKEN:-}" ]; then
            token="$ACTIONS_RUNTIME_TOKEN"
            echo "ACTIONS_RUNTIME_TOKEN=${token:0:6}…${token: -6} (len=${#token})"
          else
            echo "ACTIONS_RUNTIME_TOKEN=<unset>"
          fi
          echo "ACTIONS_RUNTIME_URL=${ACTIONS_RUNTIME_URL:-<unset>}"
          echo "ACTIONS_RESULTS_URL=${ACTIONS_RESULTS_URL:-<unset>}"

      - name: Create tiny file
        shell: bash
        run: |
          set -euo pipefail
          test -f demo.mp4
          ls -la demo.mp4

      - name: Compute SHA-256 (source)
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          sha=$(sha256sum demo.mp4 | awk '{print $1}')
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "SHA256(source)=$sha"

      - name: Upload tiny file (toolkit zip:false)
        uses: ./.github/actions/upload-single-file-artifact
        with:
          name: smoke-toolkit
          file: demo.mp4
          retention-days: '1'
          debug-env: 'true'

      - name: Download tiny file (toolkit) + verify SHA-256
        uses: ./.github/actions/download-single-file-artifact
        with:
          name: smoke-toolkit
          download-dir: downloaded
          expected-sha256: ${{ steps.sha.outputs.sha256 }}
          debug-env: 'true'

      - name: Comment PR with artifact link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PR_COMMENT_TOKEN || github.token }}
          script: |
            try {
              const owner = context.repo.owner
              const repo = context.repo.repo
              const runId = context.runId
              const artifactName = 'smoke-toolkit'

              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                { owner, repo, run_id: runId }
              )

              const artifact = artifacts.find(a => a.name === artifactName)
              if (!artifact) {
                core.warning(`Could not find artifact named '${artifactName}' for run ${runId}`)
                return
              }

              const artifactUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}/artifacts/${artifact.id}`

              const pr = context.payload.pull_request
              const headRepoFull = pr?.head?.repo?.full_name || `${owner}/${repo}`
              const headSha = pr?.head?.sha || context.sha
              const repoFileUrl = `https://github.com/${headRepoFull}/blob/${headSha}/demo.mp4`

              const body = [
                '### Smoke artifact video (demo.mp4)',
                '',
                `- Uploaded artifact: ${artifactUrl}`,
                `- Repo file (sanity): ${repoFileUrl}`,
                '',
                '_Note: GitHub PR comments may require a token with write permissions. If this step logs a 403, add a PR_COMMENT_TOKEN secret or enable workflow write permissions._'
              ].join('\n')

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body
              })
              core.info(`Posted PR comment with artifact link: ${artifactUrl}`)
            } catch (error) {
              core.warning(
                `Unable to create PR comment. This does not affect artifact upload/download validation. Error: ${error?.message || String(error)}`
              )
            }
